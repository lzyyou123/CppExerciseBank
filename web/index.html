<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++练习题 · 分章题库</title>
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --ink:#0f172a;
  --ink-2:#334155;
  --ink-3:#64748b;
  --line:#e2e8f0;
  --bg:#f6f8fc;
  --card:#ffffff;
  --code-bg:#1e293b;
  --code-ink:#e2e8f0;
  --radius:12px;
  --chap-color:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}

.app{display:flex;min-height:100vh;}

/* ============ 侧边栏 ============ */
.sidebar{
  width:272px;flex:0 0 272px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:20px 16px 28px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:20px;}
.logo{
  width:42px;height:42px;flex:0 0 42px;border-radius:11px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  letter-spacing:.5px;
}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
.brand p{margin:1px 0 0;font-size:12px;color:var(--ink-3);}

.progress-box{
  background:var(--blue-soft);border:1px solid #dbeafe;
  border-radius:10px;padding:11px 12px;margin-bottom:14px;
}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:#1e40af;margin-bottom:7px;font-weight:600;}
.progress-bar{height:6px;background:#dbeafe;border-radius:99px;overflow:hidden;}
.progress-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:99px;transition:width .3s;}

.search-box{margin-bottom:12px;position:relative;}
.search-box input{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  font-size:13px;outline:none;background:#fbfdff;color:var(--ink);
}
.search-box input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.08);}

#chapterNav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border:none;background:transparent;border-radius:9px;
  text-align:left;font-size:13.5px;color:var(--ink-2);width:100%;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:#f1f5f9;}
.nav-item.active{background:var(--blue-soft);color:var(--blue-dark);font-weight:700;}
.nav-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.nav-num{font-size:11px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums;}
.nav-item.active .nav-num{color:var(--blue-dark);}

.side-foot{margin-top:18px;font-size:11.5px;color:#94a3b8;line-height:1.6;border-top:1px dashed var(--line);padding-top:12px;}

/* ============ 主区 ============ */
.main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1180px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px;}
.topbar h2{
  font-size:22px;margin:0 0 5px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;gap:9px;
}
.topbar h2::before{
  content:"";width:5px;height:21px;border-radius:3px;background:var(--chap-color);display:inline-block;
}
.topbar p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.6;}
.toolbar{display:flex;gap:8px;flex:0 0 auto;padding-top:4px;}
.toolbar button{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  padding:7px 13px;border-radius:8px;font-size:12.5px;transition:.15s;
}
.toolbar button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0;}
.tabs button{
  position:relative;border:none;background:transparent;
  padding:9px 16px 11px;font-size:14px;color:var(--ink-3);font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;
}
.tabs button:hover{color:var(--blue);}
.tabs button.active{color:var(--blue-dark);border-bottom-color:var(--blue);}
.tabs button span{font-size:11.5px;color:#94a3b8;font-weight:400;margin-left:3px;}
.tabs button.active span{color:var(--blue);}
.tabs button.tabs-chip{
  margin-left:auto;margin-right:2px;align-self:center;margin-bottom:6px;
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:12px;color:#64748b;font-weight:600;background:#fff;transition:.15s;
}
.tabs button.tabs-chip:hover:not(:disabled){border-color:#fcd34d;color:#b45309;background:#fffbeb;}
.tabs button.tabs-chip.on{border-color:#f59e0b;background:#fef3c7;color:#b45309;}
.tabs button.tabs-chip:disabled{opacity:.45;cursor:not-allowed;}
.focus-bar{
  margin-bottom:14px;padding:10px 14px;border-radius:9px;font-size:13px;
  background:#fffbeb;border:1px solid #fcd34d;color:#92400e;
}

/* ============ 题目卡片 ============ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px 16px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
  transition:box-shadow .18s,border-color .18s;
}
.card:hover{box-shadow:0 4px 14px rgba(15,23,42,.06);border-color:#cbd5e1;}
.card.is-mastered{border-left:3px solid #10b981;}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.tag-no{
  font-size:11.5px;font-weight:700;color:#fff;background:var(--chap-color);
  padding:2px 9px;border-radius:6px;letter-spacing:.3px;
}
.tag-type{font-size:11.5px;color:var(--ink-3);background:#f1f5f9;padding:2px 8px;border-radius:6px;}
.tag-level{font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:600;}
.lv-1{background:#ecfdf5;color:#047857;}
.lv-2{background:#eff6ff;color:#1d4ed8;}
.lv-3{background:#fff7ed;color:#c2410c;}
/* ===== 重点题标注：常考 / 易错 / 难题 ===== */
.tag-mark{font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:700;border:1px solid transparent;white-space:nowrap;}
.tag-exam{background:#fffbeb;color:#b45309;border-color:#fcd34d;}
.tag-mistake{background:#fef2f2;color:#b91c1c;border-color:#fca5a5;}
.tag-hard{background:#f5f3ff;color:#6d28d9;border-color:#c4b5fd;}
.qid{margin-left:auto;font-size:11px;color:#cbd5e1;font-family:Consolas,monospace;}
.card.is-mastered .qid{color:#10b981;}

.q-title{font-size:16px;font-weight:700;margin:0 0 10px;color:var(--ink);}
.q-body{font-size:14.5px;color:var(--ink-2);line-height:1.85;margin-bottom:12px;}
.q-body p{margin:0 0 8px;}
.q-body p:last-child{margin-bottom:0;}

.section{margin-bottom:11px;}
.section h4{
  font-size:12.5px;color:var(--blue-dark);margin:0 0 4px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.section h4::before{content:"";width:3px;height:12px;background:var(--chap-color);border-radius:2px;display:inline-block;}
.section p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.8;}

/* 代码块 */
pre.code{
  background:var(--code-bg);color:var(--code-ink);
  padding:13px 15px;border-radius:9px;overflow-x:auto;
  font-family:Consolas,"Cascadia Mono","Courier New",monospace;
  font-size:13px;line-height:1.65;margin:10px 0 12px;
  tab-size:4;
}
pre.code.light{
  background:#f8fafc;color:var(--ink);border:1px solid var(--line);
  font-size:13px;
}
.tok-kw{color:#7dd3fc;font-weight:600;}
.tok-str{color:#86efac;}
.tok-num{color:#fcd34d;}
.tok-com{color:#94a3b8;font-style:italic;}
.tok-pre{color:#f9a8d4;}
.tok-fn{color:#c4b5fd;}

/* 选项 */
ul.options{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:7px;}
ul.options li{
  display:flex;gap:9px;align-items:flex-start;
  padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:14px;color:var(--ink-2);cursor:pointer;transition:.15s;background:#fdfefe;
}
ul.options li:hover{border-color:#bfdbfe;background:#f8fbff;}
ul.options li.picked{border-color:var(--blue);background:var(--blue-soft);}
ul.options li b{
  flex:0 0 21px;height:21px;border-radius:6px;background:#f1f5f9;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
ul.options li.picked b{background:var(--blue);color:#fff;}
ul.options li.right{border-color:#10b981;background:#f0fdf4;}
ul.options li.right b{background:#10b981;color:#fff;}
ul.options li.wrong{border-color:#f87171;background:#fef2f2;}
ul.options li.wrong b{background:#f87171;color:#fff;}
ul.options li em{font-style:normal;font-family:Consolas,monospace;background:#f1f5f9;padding:0 4px;border-radius:3px;font-size:13px;}

/* 样例 */
.samples{display:flex;flex-direction:column;gap:9px;margin:10px 0 12px;}
.sample{
  border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fbfdff;
}
.sample-h{
  font-size:12px;font-weight:700;color:var(--ink-3);
  padding:5px 12px;background:#f1f5f9;border-bottom:1px solid var(--line);
}
.sample pre{
  margin:0;padding:9px 12px;font-family:Consolas,"Cascadia Mono",monospace;
  font-size:13px;color:var(--ink);white-space:pre-wrap;word-break:break-all;line-height:1.6;
}
.sample pre + .sample-h{border-top:1px solid var(--line);}

/* 操作区 */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);}
.actions button{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.15s;
}
.actions button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.actions button.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.actions button.on{background:#ecfdf5;border-color:#10b981;color:#047857;}

/* 答案区 */
.answer,.hint{
  margin-top:12px;border-radius:9px;padding:13px 15px;
  animation:fade .22s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.answer{background:#f8fbff;border:1px solid #dbeafe;}
.hint{background:#fffbeb;border:1px solid #fde68a;}
.hint h5,.answer h5{
  margin:0 0 7px;font-size:12.5px;font-weight:700;
}
.hint h5{color:#b45309;}
.answer h5{color:var(--blue-dark);}
.answer .ans-line{font-size:14px;margin-bottom:6px;color:var(--ink);}
.answer .ans-line b{color:#047857;font-size:15px;}
.answer .explain{font-size:13.5px;color:var(--ink-2);line-height:1.8;}
.hint p{margin:0;font-size:13.5px;color:#78350f;line-height:1.8;}
.answer pre.code{margin:10px 0 0;}
.copy-btn{
  float:right;border:1px solid #334155;background:#0f172a;color:#cbd5e1;
  font-size:11px;padding:2px 8px;border-radius:5px;margin-top:2px;
}
.copy-btn:hover{background:#1e293b;color:#fff;}

/* 空态 / 搜索结果 */
.empty{
  text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;
  background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
}
.search-result-head{
  font-size:13px;color:var(--ink-3);margin-bottom:12px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 14px;
}
.search-result-head b{color:var(--blue-dark);}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(16px);
  background:rgba(15,23,42,.92);color:#fff;padding:9px 18px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}


/* ===== 选择题判定态 ===== */
ul.options li.locked{cursor:default;}
ul.options li.locked:hover{border-color:var(--line);background:#fdfefe;}
ul.options li.right:hover{border-color:#10b981;background:#f0fdf4;}
ul.options li.wrong:hover{border-color:#f87171;background:#fef2f2;}
.answer h5.ok{color:#047857;}
.answer h5.no{color:#dc2626;}

/* ===== 代码编辑区 ===== */
.editor{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0 4px;background:#0f172a;}
.editor-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;background:#1e293b;color:#cbd5e1;font-size:12px;}
.eb-title{font-weight:600;letter-spacing:.3px;}
.eb-btns{display:flex;gap:6px;}
.eb-btns button,.file-btn{border:1px solid #334155;background:#0f172a;color:#cbd5e1;font-size:11.5px;padding:3px 9px;border-radius:6px;cursor:pointer;transition:.15s;}
.eb-btns button:hover,.file-btn:hover{background:#334155;color:#fff;}
.code-input{display:block;width:100%;min-height:230px;border:none;outline:none;resize:vertical;background:#0f172a;color:#e2e8f0;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.65;padding:12px 14px;tab-size:4;}
.code-input::placeholder{color:#64748b;}

/* ===== 判题结果 ===== */
.judge{margin-top:12px;border-radius:9px;padding:12px 14px;background:#f8fafc;border:1px solid var(--line);animation:fade .22s ease;}
.judge-head{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;margin-bottom:9px;}
.judge-head .score{margin-left:auto;font-weight:700;}
.judge-ok{color:#047857;}
.judge-no{color:#dc2626;}
.judge-err{background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:12px 14px;font-size:13px;color:#b91c1c;}
.judge-err b{display:block;margin-bottom:2px;}
.err-pre{margin:8px 0 0;background:#fff;border:1px solid #fecaca;border-radius:7px;padding:9px 11px;font-family:Consolas,monospace;font-size:12.5px;color:#7f1d1d;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;}
.case{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:7px;overflow:hidden;}
.case-h{display:flex;align-items:center;gap:8px;padding:6px 11px;font-size:12.5px;font-weight:700;background:#f8fafc;}
.case-h .idx{color:var(--ink-3);font-weight:600;}
.badge{font-size:11px;padding:1px 8px;border-radius:5px;font-weight:700;color:#fff;}
.badge.ac{background:#10b981;}
.badge.wa{background:#ef4444;}
.badge.re{background:#f59e0b;}
.badge.tle{background:#8b5cf6;}
.case-body{padding:8px 11px;font-size:12.5px;color:var(--ink-2);}
.case-body pre{margin:3px 0 7px;background:#0f172a;color:#e2e8f0;border-radius:6px;padding:7px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace;}
.case-label{font-size:11.5px;color:var(--ink-3);font-weight:700;}
.judge-tip{margin-top:8px;font-size:12px;color:var(--ink-3);}

/* ===== 判题结果折叠 ===== */
.judge-head{cursor:pointer;user-select:none;}
.judge-ops{margin-left:10px;display:flex;gap:6px;}
.judge-ops button{border:1px solid #cbd5e1;background:#fff;color:#475569;font-size:11.5px;padding:2px 9px;border-radius:6px;cursor:pointer;font-weight:600;transition:.15s;}
.judge-ops button:hover{border-color:#0f172a;color:#0f172a;}
.judge.folded{background:#f1f5f9;}
.judge.folded .judge-detail{display:none;}
.judge.folded .judge-head{margin-bottom:0;}

/* ===== 页内确认条 ===== */
.confirm-bar{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:14px;max-width:min(94vw,720px);padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.18);font-size:13.5px;color:var(--ink);animation:fade .18s ease;}
.confirm-bar .cb-msg{line-height:1.55;}
.confirm-bar .cb-btns{display:flex;gap:8px;flex-shrink:0;}
.confirm-bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap;transition:.15s;}
.confirm-bar button:hover{border-color:#94a3b8;color:var(--ink);}
.confirm-bar button.ok{background:#dc2626;border-color:#dc2626;color:#fff;}
.confirm-bar button.ok:hover{background:#b91c1c;}
.confirm-bar button.alt{background:#0f172a;border-color:#0f172a;color:#fff;}
.confirm-bar button.alt:hover{background:#1e293b;}

/* 响应式 */
@media (max-width:900px){
  .app{flex-direction:column;}
  .sidebar{
    width:100%;flex:none;height:auto;position:static;
    border-right:none;border-bottom:1px solid var(--line);padding:14px 14px 10px;
  }
  .brand{margin-bottom:12px;}
  #chapterNav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;}
  .nav-item{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);}
  .nav-num{display:none;}
  .main{padding:18px 14px 60px;max-width:none;}
  .topbar{flex-direction:column;gap:10px;}
  .topbar h2{font-size:19px;}
  .toolbar{width:100%;}
  .toolbar button{flex:1;}
  pre.code{font-size:12px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h1>C++练习题</h1>
        <p>徐英慧《C语言程序设计》第3版 · 选择题 + 编程题</p>
      </div>
    </div>
    <div class="progress-box">
      <div class="progress-text"><span>已看答案进度</span><span id="progText">0 / 0</span></div>
      <div class="progress-bar"><i id="progBar"></i></div>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索题目关键词（如 指针、闰年）">
    </div>
    <nav id="chapterNav"></nav>
    <div class="side-foot">
      选择题：选好后点「提交答案」，系统直接判定对错并给出解析。<br>
      编程题：在编辑区写代码或上传 .cpp，点「提交判题」用 5 组数据实测比对。<br>
      <b>标注说明</b>：<span class="tag-mark tag-exam">常考</span> 高频考试题型 ·
      <span class="tag-mark tag-mistake">易错</span> 常见陷阱 ·
      <span class="tag-mark tag-hard">难题</span> 综合/嵌套类。<br>
      右上角「只看重点题」可只显示带标注的题目。<br>
      判题需先双击 start.bat 启动本地服务；直接双击 index.html 时其余功能仍可用。
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="chapTitle">加载中…</h2>
        <p id="chapIntro"></p>
      </div>
      <div class="toolbar">
        <button id="expandAll">全部展开</button>
        <button id="collapseAll">全部收起</button>
        <button id="resetProgress">清除记录</button>
      </div>
    </header>
    <div class="tabs" id="tabs">
      <button data-tab="choice" class="active">选择题<span id="cntChoice"></span></button>
      <button data-tab="coding">编程题<span id="cntCoding"></span></button>
      <button class="tabs-chip" id="btnFocus" type="button" title="只显示标注了常考 / 易错 / 难题的题目">★ 只看重点题<span id="cntFocus"></span></button>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ================= 数据（构建时注入） ================= */
const DATA = [
 {
  "id": "1",
  "short": "概述",

/* ================= 工具函数 ================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
const KW = ['alignas','auto','bool','break','case','catch','char','class','const','constexpr','continue','default','delete','do','double','else','enum','explicit','extern','false','float','for','friend','goto','if','inline','int','long','namespace','new','nullptr','operator','private','protected','public','return','short','signed','sizeof','static','struct','switch','template','this','throw','true','try','typedef','typeid','typename','union','unsigned','using','virtual','void','volatile','while','string','vector','cout','cin','cerr','endl','printf','scanf','main'];
function highlight(code){
  const src = esc(code);
  return src.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;)|(^[ \t]*#[a-z]+)|\b([A-Za-z_]\w*)\b|\b(\d+\.?\d*)\b/gm,
    function(m, com, str, pre, word, num){
      if (com) return '<span class="tok-com">' + com + '</span>';
      if (str) return '<span class="tok-str">' + str + '</span>';
      if (pre) return '<span class="tok-pre">' + pre + '</span>';
      if (word) return KW.indexOf(word) >= 0 ? '<span class="tok-kw">' + word + '</span>' : word;
      if (num) return '<span class="tok-num">' + num + '</span>';
      return m;
    });
}
function codeBlock(code, withCopy){
  const btn = withCopy ? '<button class="copy-btn" data-copy="1">复制代码</button>' : '';
  return '<pre class="code">' + btn + highlight(code) + '</pre>';
}

/* ---- 页内确认条：替代原生 confirm，避免被浏览器拦截导致点了没反应 ---- */
let confirmBar = null;
function closeConfirm(){
  if (confirmBar){ confirmBar.remove(); confirmBar = null; }
}
function showConfirm(msg, actions){
  closeConfirm();
  const wrap = document.createElement('div');
  wrap.className = 'confirm-bar';
  const m = document.createElement('span'); m.className = 'cb-msg'; m.textContent = msg;
  const bw = document.createElement('span'); bw.className = 'cb-btns';
  (actions || [{text:'确定', cls:'ok'}, {text:'取消'}]).forEach(a => {
    const b = document.createElement('button');

    if (a.cls) b.className = a.cls;
    b.addEventListener('click', () => { closeConfirm(); if (a.fn) a.fn(); });
    bw.appendChild(b);
  });
  wrap.appendChild(m); wrap.appendChild(bw);

  confirmBar = wrap;
}

function syncJudgeToggle(box){

  if (tg) tg.textContent = box.classList.contains('folded') ? '展开明细' : '收起明细';
}
function toggleJudge(box){
  box.classList.toggle('folded');
  syncJudgeToggle(box);
}
function bindJudgeOps(box){
  const tg = box.querySelector('[data-act="judge-toggle"]');
  if (tg) tg.addEventListener('click', ev => { ev.stopPropagation(); toggleJudge(box); });
  const cl = box.querySelector('[data-act="judge-close"]');
  if (cl) cl.addEventListener('click', ev => { ev.stopPropagation(); box.hidden = true; box.innerHTML = ''; box.classList.remove('folded'); });
  const hd = box.querySelector('.judge-head');
  if (hd) hd.addEventListener('click', () => toggleJudge(box));
  syncJudgeToggle(box);
}

function renderJudge(box, res){
  box.hidden = false;
  box.classList.remove('folded');
  if (!res){
    box.innerHTML = '<div class="judge-err"><b>无法连接本地判题服务</b>' +
      '<div style="font-weight:400;margin-top:4px;">请双击与 index.html 同目录的 start.bat 启动服务窗口，然后刷新本页再提交。若只是练习、不需要自动判题，可继续直接使用本页面。</div></div>';
    return;
  }
  if (!res.compile || !res.compile.ok){
    box.innerHTML = '<div class="judge-err"><b>编译未通过</b><pre class="err-pre">' + esc((res.compile && res.compile.msg) || '未知错误') + '</pre></div>';
    return;
  }
  const rs = res.results || [];
  const pass = rs.filter(r => r.ok).length;
  const allOk = rs.length > 0 && pass === rs.length;
  const label = {AC:'通过', WA:'答案不符', RE:'运行错误', TLE:'超时'};
  let html = '<div class="judge-head"><span class="' + (allOk ? 'judge-ok' : 'judge-no') + '">' +
    (allOk ? '全部用例通过' : '存在未通过用例') + '</span><span class="score">' + pass + ' / ' + rs.length + '</span>' +
    '<span class="judge-ops"><button data-act="judge-toggle">收起明细</button><button data-act="judge-close">关闭</button></span></div>';
  html += '<div class="judge-detail">';
  rs.forEach(r => {
    html += '<div class="case"><div class="case-h"><span class="idx">用例 ' + r.no + '</span>' +
      '<span class="badge ' + String(r.status || 'wa').toLowerCase() + '">' + (label[r.status] || r.status) + '</span></div>' +
      '<div class="case-body">' +
        '<div class="case-label">输入</div><pre>' + (r.input ? esc(r.input) : '（无输入）') + '</pre>' +
        '<div class="case-label">期望输出</div><pre>' + esc(r.expected) + '</pre>' +
        '<div class="case-label">你的输出</div><pre>' + (r.output ? esc(r.output) : '（无输出）') + '</pre>' +
        (r.msg ? '<div class="case-label">错误信息</div><pre>' + esc(r.msg) + '</pre>' : '') +
      '</div></div>';
  });
  html += '<div class="judge-tip">判题方式：每组数据都实际运行你的程序再比对输出，忽略行末空格与末尾空行。点结果标题栏可收起或展开明细。</div>';
  html += '</div>';
  box.innerHTML = html;
  if (allOk) box.classList.add('folded');
  bindJudgeOps(box);
  syncJudgeToggle(box);
}

async function submitJudge(card, q, btn){
  const ta = card.querySelector('.code-input');
  const box = card.querySelector('.judge');
  const code = (ta.value || '').trim();
  if (!code){ toast('请先在代码编辑区写入代码，或上传 .cpp 文件'); return; }
  if (!q.tests || !q.tests.length){ toast('本题暂无判题数据'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '判题中…';
  try {
    const resp = await fetch(JUDGE_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: code, tests: q.tests})
    });
    const res = await resp.json();
    renderJudge(box, res);
    if (res.compile && res.compile.ok){
      const pass = (res.results || []).filter(r => r.ok).length;
      if (pass === q.tests.length){
        if (!progress[q.id]) progress[q.id] = {};
        progress[q.id].ac = true; progress[q.id].seen = true;
        saveProgress(); updateProgress();
        toast('全部 ' + q.tests.length + ' 组用例通过');
      } else {
        toast('通过 ' + pass + ' / ' + q.tests.length + ' 组用例');
      }
    } else {
      toast('编译未通过，见下方错误信息');
    }
  } catch(e){
    renderJudge(box, null);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

function bindCards(root){
  root.querySelectorAll('.card').forEach(card => {
    const qid = card.dataset.qid;
    const q = QMAP[qid] || {};
    const answerBox = card.querySelector('.answer');
    const hintBox = card.querySelector('.hint');
    const btnAns = card.querySelector('[data-act="answer"]');
    const btnHint = card.querySelector('[data-act="hint"]');
    const btnMaster = card.querySelector('[data-act="master"]');

    /* ---- 选择题：提交判定 ---- */
    if (q.options && q.answer !== undefined){
      const opts = card.querySelectorAll('ul.options li');
      const btnSubmit = card.querySelector('[data-act="submit"]');
      const btnRetry = card.querySelector('[data-act="retry"]');
      const st = progress[qid] || {};
      const submitted = (st.picked !== undefined && st.picked !== null);
      if (submitted) renderChoiceAnswer(card, q, st.picked, false);
      if (btnSubmit){
        if (submitted){ btnSubmit.textContent = '已提交'; btnSubmit.disabled = true; }
        if (btnRetry && submitted) btnRetry.hidden = false;
        btnSubmit.addEventListener('click', () => {
          const cur = progress[qid] || {};
          if (cur.picked !== undefined && cur.picked !== null){ toast('本题已提交，点「重做」可重新作答'); return; }
          const sel = card.querySelector('ul.options li.picked');
          if (!sel){ toast('请先选择一个选项'); return; }
          const picked = parseInt(sel.dataset.opt, 10);
          if (!progress[qid]) progress[qid] = {};
          progress[qid].picked = picked;
          progress[qid].correct = (picked === q.answer);
          progress[qid].seen = true;
          saveProgress(); updateProgress();
          renderChoiceAnswer(card, q, picked, true);
          btnSubmit.textContent = '已提交'; btnSubmit.disabled = true;
          if (btnRetry) btnRetry.hidden = false;
          toast(picked === q.answer ? '回答正确' : '回答错误，看看解析');
        });
      }
      if (btnRetry){
        btnRetry.addEventListener('click', () => {
          if (progress[qid]){ delete progress[qid].picked; delete progress[qid].correct; }
          saveProgress(); updateProgress();
          card.querySelectorAll('ul.options li').forEach(li => li.classList.remove('picked','right','wrong','locked'));
          const box = card.querySelector('.answer');
          if (box){ box.hidden = true; box.innerHTML = ''; }
          if (btnSubmit){ btnSubmit.textContent = '提交答案'; btnSubmit.disabled = false; }
          btnRetry.hidden = true;
        });
      }
      opts.forEach(li => {
        li.addEventListener('click', () => {
          const cur = progress[qid] || {};
          if (cur.picked !== undefined && cur.picked !== null){ toast('本题已提交，点「重做」可重新作答'); return; }
          opts.forEach(x => x.classList.remove('picked'));
          li.classList.add('picked');
        });
      });
    }

    /* ---- 编程题：编辑器 / 上传 / 判题 ---- */
    const ta = card.querySelector('.code-input');
    if (ta){
      if (codeStore[qid]) ta.value = codeStore[qid];
      ta.addEventListener('input', () => saveCode(qid, ta.value));
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab'){
          e.preventDefault();
          const s = ta.selectionStart, en = ta.selectionEnd;
          ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = s + 4;
          saveCode(qid, ta.value);
        }
      });
      const clearBtn = card.querySelector('[data-act="clear"]');
      if (clearBtn) clearBtn.addEventListener('click', () => {
        const doClear = () => { ta.value = ''; saveCode(qid, ''); toast('已清空本题代码'); };
        if (!ta.value.trim()){ doClear(); return; }
        showConfirm('确定清空本题已写的代码吗？清空后不可恢复。', [
          { text: '确定清空', cls: 'ok', fn: doClear },
          { text: '取消' }
        ]);
      });
      const up = card.querySelector('[data-act="upload"]');
      if (up) up.addEventListener('change', async e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const buf = await f.arrayBuffer();
        let text = '';
        try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
        catch(err1){
          try { text = new TextDecoder('gbk').decode(buf); }
          catch(err2){ text = new TextDecoder('utf-8').decode(buf); }
        }
        e.target.value = '';
        const apply = () => { ta.value = text; saveCode(qid, text); toast('已载入 ' + f.name); };
        if (ta.value.trim()){
          showConfirm('编辑区已有代码，是否用「' + f.name + '」覆盖？', [
            { text: '覆盖', cls: 'alt', fn: apply },
            { text: '取消' }
          ]);
        } else apply();
      });
      const judgeBtn = card.querySelector('[data-act="judge"]');
      if (judgeBtn) judgeBtn.addEventListener('click', () => submitJudge(card, q, judgeBtn));
    }

    /* ---- 公共：答案折叠 / 已掌握 ---- */
    if (btnAns){
      if (progress[qid] && progress[qid].seen){
        btnAns.textContent = hintBox ? '收起参考代码' : '收起答案';
        btnAns.classList.remove('primary');
      }
      btnAns.addEventListener('click', () => {
        const open = !answerBox.hidden;
        answerBox.hidden = open;
        btnAns.textContent = open ? (btnHint ? '查看参考代码' : '查看答案') : (btnHint ? '收起参考代码' : '收起答案');
        btnAns.classList.toggle('primary', open);
        if (!open) markSeen(qid);
      });
    }
    if (btnHint){
      btnHint.addEventListener('click', () => {
        const open = !hintBox.hidden;
        hintBox.hidden = open;
        btnHint.textContent = open ? '查看思路提示' : '收起思路提示';
      });
    }
    if (btnMaster){
      btnMaster.addEventListener('click', () => {
        if (!progress[qid]) progress[qid] = {};
        const now = !progress[qid].mastered;
        progress[qid].mastered = now;
        if (now) progress[qid].seen = true;
        saveProgress();
        updateProgress();
        btnMaster.classList.toggle('on', now);
        card.classList.toggle('is-mastered', now);
        if (!now) markSeenToBtn(card);
        toast(now ? '已标记为已掌握' : '已取消标记');
      });
    }

    /* ---- 代码复制 ---- */
    const copyBtn = card.querySelector('.copy-btn');
    if (copyBtn){
      copyBtn.addEventListener('click', () => {
        const pre = copyBtn.parentElement;
        const text = pre.innerText.replace(/^复制代码\s*/, '');
        copyText(text);
      });
    }
  });
}

function markSeenToBtn(card){
  const btnAns = card.querySelector('[data-act="answer"]');
  if (!btnAns) return;
  if (progress[card.dataset.qid] && progress[card.dataset.qid].seen){
    btnAns.textContent = card.querySelector('.hint') ? '收起参考代码' : '收起答案';
    btnAns.classList.remove('primary');
  } else {
    btnAns.textContent = card.querySelector('.hint') ? '查看参考代码' : '查看答案';
    btnAns.classList.add('primary');
  }
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast('代码已复制'), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('代码已复制'); } catch(e){ toast('复制失败，请手动选中'); }
  document.body.removeChild(ta);
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ================= 搜索 ================= */
function doSearch(kw){
  kw = kw.trim();
  if (!kw){ searchMode = false; renderContent(); return; }
  searchKw = kw;
  searchMode = true;
  searchHits = [];
  const low = kw.toLowerCase();
  DATA.forEach(c => {
    c.choice.forEach((q, i) => {
      const hay = (q.q + ' ' + (q.code || '') + ' ' + q.options.join(' ') + ' ' + q.explain + ' ' + (q.tag || []).join(' ')).toLowerCase();
      if (hay.indexOf(low) >= 0)
        searchHits.push({ type:'choice', html: choiceHTML(q, i, c.color), chap: c.short });
    });
    c.coding.forEach((q, i) => {
      const hay = (q.title + ' ' + q.desc + ' ' + q.input + ' ' + q.output + ' ' + q.hint + ' ' + q.code + ' ' + (q.tags||[]).join(' ')).toLowerCase();
      if (hay.indexOf(low) >= 0)
        searchHits.push({ type:'coding', html: codingHTML(q, i, c.color), chap: c.short });
    });
  });
  renderContent();
}

/* ================= 事件绑定 ================= */
document.getElementById('chapterNav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  curChap = parseInt(btn.dataset.chap, 10);
  searchMode = false;
  document.getElementById('searchInput').value = '';
  renderNav();
  renderContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.id === 'btnFocus'){
    focusOnly = !focusOnly;
    renderContent();
    return;
  }
  if (!btn.dataset.tab) return;
  focusOnly = false;
  curTab = btn.dataset.tab;
  renderContent();
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('#content .answer, #content .hint').forEach(el => { if (el.innerHTML.trim()) el.hidden = false; });
  document.querySelectorAll('#content .card').forEach(card => {
    markSeen(card.dataset.qid);
    card.querySelectorAll('[data-act="answer"]').forEach(b => {
      b.textContent = card.querySelector('.hint') ? '收起参考代码' : '收起答案';
      b.classList.remove('primary');
    });
    card.querySelectorAll('[data-act="hint"]').forEach(b => b.textContent = '收起思路提示');
  });
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('#content .answer, #content .hint').forEach(el => el.hidden = true);
  document.querySelectorAll('#content .card').forEach(card => {
    markSeenToBtn(card);
    card.querySelectorAll('[data-act="hint"]').forEach(b => b.textContent = '查看思路提示');
  });
});

document.getElementById('resetProgress').addEventListener('click', () => {
  const cnt = Object.keys(progress).length;
  const codeCnt = Object.keys(codeStore).filter(k => (codeStore[k] || '').trim()).length;
  const clearProgress = () => {
    progress = {};
    try { localStorage.removeItem(STORE_KEY); } catch(e){}
    updateProgress(); renderContent();
  };
  showConfirm('清除本机记录？当前有 ' + cnt + ' 道题的作答/掌握记录、' + codeCnt + ' 道题存了代码。', [
    { text: '清除记录', cls: 'ok', fn: () => { clearProgress(); toast('已清除 ' + cnt + ' 道题的作答记录（代码框内容仍保留）'); } },
    { text: '连代码一起清空', cls: 'alt', fn: () => {
        clearProgress();
        codeStore = {};
        try { localStorage.removeItem(CODE_KEY); } catch(e){}
        renderContent();
        toast('记录与代码已全部清空');
      } },
    { text: '取消' }
  ]);
});

let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => doSearch(v), 260);
});

/* ================= 启动 ================= */
renderNav();
renderContent();
updateProgress();
</script>
